<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<meta name="theme-color" content="#07080f"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="30KM Plan"/>
<link rel="manifest" href="manifest.json"/>
<title>Plan Biegowy 30 km</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:#07080f;color:#e0e4f0;font-family:system-ui,sans-serif;max-width:480px;margin:0 auto;min-height:100vh}
::-webkit-scrollbar{display:none}
button{font-family:inherit;cursor:pointer}
input,textarea{font-family:inherit;-webkit-appearance:none}
input::placeholder,textarea::placeholder{color:#1e2138}
button:active{opacity:.8}

/* install banner */
#install-banner{display:none;position:fixed;bottom:0;left:0;right:0;z-index:300;background:linear-gradient(135deg,#0f1228,#12102a);border-top:2px solid #b8ff3e;padding:16px 20px 32px;max-width:480px;margin:0 auto;box-shadow:0 -8px 40px #b8ff3e18}
#install-banner.show{display:block}
#install-inner{display:flex;align-items:center;gap:14px}
#install-icon{width:48px;height:48px;border-radius:14px;background:linear-gradient(135deg,#b8ff3e,#44f6a9);display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0}
#install-text{flex:1}
#install-title{font-size:15px;font-weight:800;color:#ecefff}
#install-sub{font-size:11px;color:#3a3f60;margin-top:2px}
#install-btn{background:#b8ff3e;border:none;border-radius:14px;color:#07080f;font-size:13px;font-weight:800;padding:10px 18px;white-space:nowrap}
#install-close{position:absolute;top:12px;right:16px;background:none;border:none;color:#3a3f60;font-size:18px}

#stripe{height:4px;background:#141628}
#stripe-fill{height:100%;background:linear-gradient(90deg,#5b9cf6,#b8ff3e,#44f6a9);transition:width .6s ease;width:0%}
#header{background:linear-gradient(150deg,#0b0d1e 0%,#0f1228 55%,#12102a 100%);padding:24px 18px 20px;position:relative;overflow:hidden}
#header-row{display:flex;justify-content:space-between;align-items:flex-start;position:relative;z-index:1}
#title-label{font-size:10px;color:#3a3f60;font-weight:700;letter-spacing:.2em;text-transform:uppercase;margin-bottom:4px}
#title-big{font-size:48px;color:#ecefff;line-height:1;font-weight:900}
#title-sub{font-size:11px;color:#2e334e;font-weight:700;letter-spacing:.08em;margin-top:3px}
#rules-btn{background:none;border:1px solid #252840;border-radius:20px;color:#3a3f60;font-size:10px;padding:5px 13px;font-weight:700;letter-spacing:.08em;margin-top:8px;display:block}
#ring-wrap{position:relative;width:78px;height:78px;flex-shrink:0}
#ring-label{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
#ring-pct{font-size:20px;color:#b8ff3e;font-weight:900;line-height:1}
#ring-done{font-size:8px;color:#3a3f60;font-weight:700;letter-spacing:.08em}
#stats-row{display:flex;align-items:center;gap:14px;margin-top:18px;position:relative;z-index:1}
#stats-cards{flex:1;display:flex;gap:10px}
.stat-card{flex:1;background:#0d0f1e;border-radius:14px;padding:10px 13px;border:1px solid #191c30}
.stat-lbl{font-size:10px;color:#3a3f60;font-weight:700;text-transform:uppercase;letter-spacing:.1em}
.stat-val{font-size:20px;font-weight:900;margin-top:3px}
#tabs{display:flex;gap:8px;padding:16px 16px 8px;overflow-x:auto;scrollbar-width:none}
.tab{flex-shrink:0;padding:9px 15px;border-radius:16px;font-size:12px;font-weight:700;transition:all .25s;text-align:center}
.tab-sub{font-size:9px;opacity:.75;font-weight:600}
.tab-cnt{font-size:9px;margin-top:2px;opacity:.65}
#weeks{padding:4px 12px 120px}
.week-card{background:#0d0f1e;border-radius:18px;margin-bottom:10px;overflow:hidden;transition:all .3s}
.week-header{padding:14px 16px;display:flex;align-items:center;gap:12px;cursor:pointer}
.week-num{font-size:38px;font-weight:900;line-height:1;min-width:50px;transition:color .3s}
.week-info{flex:1}
.week-badges{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:7px}
.badge{font-size:9px;padding:2px 8px;border-radius:10px;font-weight:700}
.week-dots{display:flex;gap:6px}
.dot-pill{display:flex;align-items:center;gap:4px;border-radius:8px;padding:3px 8px}
.dot-circle{width:7px;height:7px;border-radius:50%}
.dot-km{font-size:10px;font-weight:700}
.week-km-wrap{text-align:right}
.week-km{font-size:26px;font-weight:900;line-height:1}
.week-km-lbl{font-size:9px;color:#2e334e;font-weight:700;letter-spacing:.08em}
.chevron{color:#252840;font-size:10px;transition:transform .3s}
.week-body{padding:0 12px 12px}
.km-bar-wrap{height:4px;background:#13162a;border-radius:3px;overflow:hidden;margin-bottom:12px}
.km-bar-fill{height:100%;border-radius:3px;transition:width .5s}
.workout-row{border-radius:14px;padding:12px 13px;margin-bottom:8px;display:flex;align-items:center;gap:11px;cursor:pointer}
.workout-icon{border-radius:10px;width:40px;height:40px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:18px}
.workout-info{flex:1;min-width:0}
.workout-title-row{display:flex;align-items:baseline;gap:6px}
.workout-day{font-size:10px;color:#3a3f60;font-weight:700}
.workout-name{font-size:14px;font-weight:700}
.workout-km-lbl{margin-left:auto;font-size:18px;font-weight:900}
.workout-meta{font-size:10px;color:#2e334e;margin-top:3px;display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.workout-time{padding:2px 8px;border-radius:8px;font-weight:600;font-size:10px}
.done-btn{width:36px;height:36px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:16px;transition:all .2s}
.modal-overlay{position:fixed;inset:0;z-index:200;display:flex;flex-direction:column;justify-content:flex-end}
.modal-bg{position:absolute;inset:0;background:rgba(3,4,11,.88)}
.modal-sheet{position:relative;z-index:1;background:#0d0f1e;border-radius:24px 24px 0 0;padding:24px 20px 44px}
.modal-handle{width:40px;height:4px;background:#1e2138;border-radius:2px;margin:0 auto 20px}
.modal-header{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.modal-icon{border-radius:14px;width:50px;height:50px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:24px}
.modal-field-lbl{font-size:10px;color:#3a3f60;font-weight:700;letter-spacing:.14em;text-transform:uppercase;margin-bottom:7px}
.modal-input{width:100%;background:#111428;border-radius:14px;padding:13px 16px;color:#e0e4f0;font-size:15px;outline:none;border:1.5px solid transparent}
.modal-textarea{width:100%;background:#111428;border-radius:14px;padding:13px 16px;color:#e0e4f0;font-size:14px;outline:none;resize:none;border:1.5px solid transparent}
.modal-btns{display:flex;gap:10px;margin-top:20px}
.modal-primary{flex:1;padding:15px;border-radius:16px;font-size:14px;font-weight:800;transition:all .2s}
.modal-close-btn{padding:15px 18px;background:#111428;border:1.5px solid #1e2138;border-radius:16px;color:#3a3f60;font-size:14px}
</style>
</head>
<body>

<!-- INSTALL BANNER -->
<div id="install-banner">
  <button id="install-close" onclick="closeBanner()">✕</button>
  <div id="install-inner">
    <div id="install-icon">🏃</div>
    <div id="install-text">
      <div id="install-title">Zainstaluj aplikację</div>
      <div id="install-sub">Działa offline, bez przeglądarki</div>
    </div>
    <button id="install-btn" onclick="installApp()">Zainstaluj</button>
  </div>
</div>

<div id="stripe"><div id="stripe-fill"></div></div>

<div id="header">
  <div id="header-row">
    <div>
      <div id="title-label">Plan bezpieczny</div>
      <div id="title-big">30 KM</div>
      <div id="title-sub">12 TYGODNI · 3 BIEGI / TYDZIEŃ</div>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:8px">
      <svg id="runner-svg" width="68" height="80" viewBox="0 0 80 90" fill="none">
        <ellipse cx="48" cy="84" rx="26" ry="4" fill="#252840" opacity="0.3"/>
        <circle cx="58" cy="11" r="9" fill="#252840"/>
        <line x1="58" y1="20" x2="50" y2="46" stroke="#252840" stroke-width="5.5" stroke-linecap="round"/>
        <line x1="54" y1="30" x2="72" y2="20" stroke="#252840" stroke-width="4" stroke-linecap="round"/>
        <line x1="54" y1="32" x2="35" y2="43" stroke="#252840" stroke-width="4" stroke-linecap="round"/>
        <line x1="50" y1="46" x2="64" y2="68" stroke="#252840" stroke-width="5.5" stroke-linecap="round"/>
        <line x1="64" y1="68" x2="78" y2="63" stroke="#252840" stroke-width="4" stroke-linecap="round"/>
        <line x1="50" y1="46" x2="35" y2="65" stroke="#252840" stroke-width="5.5" stroke-linecap="round"/>
        <line x1="35" y1="65" x2="22" y2="72" stroke="#252840" stroke-width="4" stroke-linecap="round"/>
      </svg>
      <button id="rules-btn" onclick="showRules()">ZASADY ℹ️</button>
    </div>
  </div>
  <div id="stats-row">
    <div id="ring-wrap">
      <svg width="78" height="78" style="transform:rotate(-90deg)">
        <circle cx="39" cy="39" r="32" fill="none" stroke="#1c1f32" stroke-width="7"/>
        <circle id="ring-arc" cx="39" cy="39" r="32" fill="none" stroke="#b8ff3e" stroke-width="7"
          stroke-dasharray="0 201" stroke-linecap="round" style="transition:stroke-dasharray .6s ease;transform:rotate(-90deg);transform-origin:39px 39px"/>
      </svg>
      <div id="ring-label">
        <div id="ring-pct">0%</div>
        <div id="ring-done">DONE</div>
      </div>
    </div>
    <div id="stats-cards">
      <div class="stat-card">
        <div class="stat-lbl">Treningi</div>
        <div class="stat-val" id="stat-workouts" style="color:#b8ff3e">0/35</div>
      </div>
      <div class="stat-card">
        <div class="stat-lbl">Kilometry</div>
        <div class="stat-val" id="stat-km" style="color:#5b9cf6">0/346</div>
      </div>
    </div>
  </div>
</div>

<div id="tabs"></div>
<div id="weeks"></div>

<div id="workout-modal" class="modal-overlay" style="display:none">
  <div class="modal-bg" onclick="closeModal()"></div>
  <div class="modal-sheet" id="workout-sheet">
    <div class="modal-handle"></div>
    <div class="modal-header">
      <div class="modal-icon" id="modal-icon"></div>
      <div style="flex:1">
        <div id="modal-name" style="font-size:18px;font-weight:800"></div>
        <div id="modal-meta" style="font-size:11px;color:#3a3f60;margin-top:3px"></div>
      </div>
      <div style="text-align:right">
        <div id="modal-km" style="font-size:34px;font-weight:900;line-height:1"></div>
        <div style="font-size:10px;color:#3a3f60;font-weight:700">KM</div>
      </div>
    </div>
    <div style="margin-bottom:14px">
      <div class="modal-field-lbl">⏱ Czas / Wynik</div>
      <input id="modal-time" class="modal-input" type="text" placeholder="np. 58:30  lub  1:05:00" oninput="onModalInput('time',this.value)"/>
    </div>
    <div>
      <div class="modal-field-lbl">💬 Notatki</div>
      <textarea id="modal-notes" class="modal-textarea" rows="3" placeholder="Jak się czułeś? Tempo? Trasa?" oninput="onModalInput('notes',this.value)"></textarea>
    </div>
    <div class="modal-btns">
      <button class="modal-primary" id="modal-done-btn" onclick="toggleModalDone()"></button>
      <button class="modal-close-btn" onclick="closeModal()">Zamknij</button>
    </div>
  </div>
</div>

<div id="rules-modal" class="modal-overlay" style="display:none">
  <div class="modal-bg" onclick="document.getElementById('rules-modal').style.display='none'"></div>
  <div class="modal-sheet" style="border-top:3px solid #f65b5b;box-shadow:0 -14px 60px #f65b5b22">
    <div class="modal-handle"></div>
    <div class="modal-header">
      <div class="modal-icon" style="background:#f65b5b20;font-size:24px">🔥</div>
      <div>
        <div style="font-size:24px;font-weight:900;color:#f65b5b">ZASADY TWARDE</div>
        <div style="font-size:11px;color:#3a3f60">Przestrzegaj ich bez wyjątków</div>
      </div>
    </div>
    <div id="rules-list"></div>
    <button onclick="document.getElementById('rules-modal').style.display='none'" style="margin-top:20px;width:100%;padding:15px;background:#f65b5b;border:none;border-radius:16px;color:#07080f;font-size:14px;font-weight:800;">Rozumiem, zamknij</button>
  </div>
</div>

<script>
// ── PWA: Service Worker + Install ──────────────────────────────
const SW_CODE = `
const CACHE='run30km-v1';
const FILES=['/'];
self.addEventListener('install',e=>e.waitUntil(caches.open(CACHE).then(c=>c.addAll(FILES))));
self.addEventListener('fetch',e=>e.respondWith(caches.match(e.request).then(r=>r||fetch(e.request))));
`;

// Inline service worker via blob – działa bez serwera
if('serviceWorker' in navigator){
  const blob = new Blob([SW_CODE],{type:'application/javascript'});
  const swUrl = URL.createObjectURL(blob);
  navigator.serviceWorker.register(swUrl).catch(()=>{});
}

let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredPrompt = e;
  document.getElementById('install-banner').classList.add('show');
});
window.addEventListener('appinstalled', () => {
  document.getElementById('install-banner').classList.remove('show');
  deferredPrompt = null;
});

function installApp() {
  if(deferredPrompt){ deferredPrompt.prompt(); deferredPrompt.userChoice.then(()=>{ deferredPrompt=null; document.getElementById('install-banner').classList.remove('show'); }); }
}
function closeBanner(){ document.getElementById('install-banner').classList.remove('show'); }

// ── DATA ───────────────────────────────────────────────────────
const PLAN = [
  {week:1,lighter:false,workouts:[{id:"w1-regen",day:"Wtorek",type:"regen",km:8},{id:"w1-proper",day:"Czwartek",type:"proper",km:10},{id:"w1-long",day:"Niedziela",type:"long",km:13}]},
  {week:2,lighter:false,workouts:[{id:"w2-regen",day:"Wtorek",type:"regen",km:8},{id:"w2-proper",day:"Czwartek",type:"proper",km:11},{id:"w2-long",day:"Niedziela",type:"long",km:14}]},
  {week:3,lighter:false,workouts:[{id:"w3-regen",day:"Wtorek",type:"regen",km:9},{id:"w3-proper",day:"Czwartek",type:"proper",km:12},{id:"w3-long",day:"Niedziela",type:"long",km:16}]},
  {week:4,lighter:true, workouts:[{id:"w4-regen",day:"Wtorek",type:"regen",km:7},{id:"w4-proper",day:"Czwartek",type:"proper",km:10},{id:"w4-long",day:"Niedziela",type:"long",km:13}]},
  {week:5,lighter:false,workouts:[{id:"w5-regen",day:"Wtorek",type:"regen",km:9},{id:"w5-proper",day:"Czwartek",type:"proper",km:12},{id:"w5-long",day:"Niedziela",type:"long",km:17}]},
  {week:6,lighter:false,workouts:[{id:"w6-regen",day:"Wtorek",type:"regen",km:9},{id:"w6-proper",day:"Czwartek",type:"proper",km:13},{id:"w6-long",day:"Niedziela",type:"long",km:19}]},
  {week:7,lighter:true, workouts:[{id:"w7-regen",day:"Wtorek",type:"regen",km:8},{id:"w7-proper",day:"Czwartek",type:"proper",km:11},{id:"w7-long",day:"Niedziela",type:"long",km:16}]},
  {week:8,lighter:false,workouts:[{id:"w8-regen",day:"Wtorek",type:"regen",km:9},{id:"w8-proper",day:"Czwartek",type:"proper",km:13},{id:"w8-long",day:"Niedziela",type:"long",km:20}]},
  {week:9,lighter:true, workouts:[{id:"w9-regen",day:"Wtorek",type:"regen",km:10},{id:"w9-proper",day:"Czwartek",type:"proper",km:14},{id:"w9-long",day:"Niedziela",type:"long",km:18}]},
  {week:10,lighter:false,workouts:[{id:"w10-regen",day:"Wtorek",type:"regen",km:10},{id:"w10-proper",day:"Czwartek",type:"proper",km:14},{id:"w10-long",day:"Niedziela",type:"long",km:22}]},
  {week:11,lighter:false,workouts:[{id:"w11-regen",day:"Wtorek",type:"regen",km:9},{id:"w11-proper",day:"Czwartek",type:"proper",km:13},{id:"w11-long",day:"Niedziela",type:"long",km:20}]},
  {week:12,lighter:false,workouts:[{id:"w12-regen",day:"Wtorek",type:"regen",km:8},{id:"w12-proper",day:"Czwartek",type:"proper",km:12},{id:"w12-goal",day:"Niedziela",type:"goal",km:30}]},
];
const PHASES=[
  {label:"FAZA I",  sub:"Budowanie bazy",weeks:[1,2,3,4],  color:"#5b9cf6"},
  {label:"FAZA II", sub:"Rozbudowa",     weeks:[5,6,7],    color:"#f6a944"},
  {label:"FAZA III",sub:"Szczyt formy",  weeks:[8,9,10,11],color:"#f65b5b"},
  {label:"FINAŁ",   sub:"30 km 🏆",      weeks:[12],       color:"#44f6a9"},
];
const TYPE={
  regen: {name:"Regeneracyjny",bpm:"130–140 bpm",color:"#5b9cf6",icon:"♥"},
  proper:{name:"Właściwy",     bpm:"135–148 bpm",color:"#f6a944",icon:"⚡"},
  long:  {name:"Długi",        bpm:"130–145 bpm",color:"#f65b5b",icon:"▲"},
  goal:  {name:"30 km — CEL!",bpm:"130–145 bpm",color:"#44f6a9",icon:"★"},
};
const RULES=["3 biegi tygodniowo max","Wtorek: regeneracyjny (130–140 bpm, bardzo luźno)","Czwartek: właściwy (135–148 bpm)","Niedziela: długi (130–145 bpm)","Po biegu >15 km → min. 2 pełne dni przerwy","Stopa boli → przerwa + fizjo","Nie dodawaj ani metra ponad plan","Po biegach >17 km – min. 2 dni off (przesuwaj treningi jeśli trzeba)","Wolniej = bezpieczniej. Lepszy wolny progres niż kontuzja."];

let data={}, currentPhase=0, openWeek=null, currentModal=null;
const allW=PLAN.flatMap(w=>w.workouts);
const totalW=allW.length;
const totalKm=allW.reduce((s,w)=>s+w.km,0);

function loadData(){try{const v=localStorage.getItem("run30km_safe_v1");if(v)data=JSON.parse(v);}catch(e){}}
function saveData(){try{localStorage.setItem("run30km_safe_v1",JSON.stringify(data));}catch(e){}}
function getDoneW(){return allW.filter(w=>data[w.id]?.done).length;}
function getDoneKm(){return allW.filter(w=>data[w.id]?.done).reduce((s,w)=>s+w.km,0);}

function updateHeader(){
  const dW=getDoneW(),dK=getDoneKm(),pct=totalW>0?dW/totalW:0;
  document.getElementById('stripe-fill').style.width=(pct*100)+'%';
  document.getElementById('ring-pct').textContent=Math.round(pct*100)+'%';
  const circ=2*Math.PI*32;
  document.getElementById('ring-arc').setAttribute('stroke-dasharray',`${circ*Math.min(pct,1)} ${circ}`);
  document.getElementById('stat-workouts').textContent=dW+'/'+totalW;
  document.getElementById('stat-km').textContent=dK+'/'+totalKm;
  const col=pct>0?'#b8ff3e':'#252840';
  document.querySelector('#runner-svg circle').setAttribute('fill',col);
  document.querySelectorAll('#runner-svg line').forEach(el=>el.setAttribute('stroke',col));
}

function renderTabs(){
  const c=document.getElementById('tabs');c.innerHTML='';
  PHASES.forEach((p,i)=>{
    const phW=PLAN.filter(w=>p.weeks.includes(w.week)).flatMap(w=>w.workouts);
    const phD=phW.filter(w=>data[w.id]?.done).length;
    const active=currentPhase===i;
    const btn=document.createElement('button');
    btn.className='tab';
    btn.style.cssText=`background:${active?p.color:'#0d0f1e'};border:1.5px solid ${active?p.color:'#191c30'};color:${active?'#07080f':p.color};box-shadow:${active?`0 4px 22px ${p.color}45`:'none'}`;
    btn.innerHTML=`<div class="tab-sub">${p.sub}</div><div>${p.label}</div><div class="tab-cnt">${phD}/${phW.length} ✓</div>`;
    btn.onclick=()=>{currentPhase=i;openWeek=null;renderTabs();renderWeeks();};
    c.appendChild(btn);
  });
}

function renderWeeks(){
  const ap=PHASES[currentPhase];
  const phaseWeeks=PLAN.filter(w=>ap.weeks.includes(w.week));
  const c=document.getElementById('weeks');c.innerHTML='';
  phaseWeeks.forEach(week=>{
    const weekKm=week.workouts.reduce((s,w)=>s+w.km,0);
    const doneCnt=week.workouts.filter(w=>data[w.id]?.done).length;
    const allDone=doneCnt===week.workouts.length;
    const isOpen=openWeek===week.week;
    const card=document.createElement('div');
    card.className='week-card';
    card.style.cssText=`border:1.5px solid ${allDone?ap.color+'55':'#181b2e'};box-shadow:${allDone?`0 4px 28px ${ap.color}1a`:'none'}`;
    const dotsHtml=week.workouts.map(w=>{const t=TYPE[w.type];const done=data[w.id]?.done;return`<div class="dot-pill" style="background:${done?t.color+'20':'#13162a'};border:1px solid ${done?t.color+'55':'transparent'}"><div class="dot-circle" style="background:${t.color};opacity:${done?1:.3}"></div><span class="dot-km" style="color:${done?t.color:'#2e334e'}">${w.km}km</span></div>`;}).join('');
    const badgesHtml=(week.lighter?`<span class="badge" style="color:#7080a0;background:#181b2e">🌙 LŻEJSZY</span>`:'')+(week.week===12?`<span class="badge" style="color:#44f6a9;background:#0d3a2540">🏆 FINAŁ</span>`:'')+`<span style="font-size:10px;color:#2e334e;margin-left:auto">${doneCnt}/${week.workouts.length} ✓</span>`;
    const weekBodyHtml=isOpen?(()=>{
      const barW=Math.min((weekKm/55)*100,100);
      const wHtml=week.workouts.map(workout=>{const t=TYPE[workout.type];const wd=data[workout.id]||{};const done=wd.done;const meta=(wd.time?`<span class="workout-time" style="color:${t.color};background:${t.color}18">⏱ ${wd.time}</span>`:'')+( wd.notes?`<span>💬</span>`:'')+(!wd.time&&!wd.notes?`<span style="color:#1e2138">Dotknij → czas / notatki</span>`:'');return`<div class="workout-row" style="background:${done?t.color+'10':'#111428'};border-left:4px solid ${done?t.color:t.color+'35'}" onclick="openModal('${workout.id}')"><div class="workout-icon" style="background:${t.color}18;opacity:${done?1:.65}">${t.icon}</div><div class="workout-info"><div class="workout-title-row"><span class="workout-day">${workout.day}</span><span class="workout-name" style="color:${done?t.color:'#d0d6ff'}">${t.name}</span><span class="workout-km-lbl" style="color:${t.color}">${workout.km} km</span></div><div class="workout-meta"><span>♥ ${t.bpm}</span>${meta}</div></div><button class="done-btn" style="background:${done?t.color:'transparent'};border:2px solid ${done?t.color:'#252840'};box-shadow:${done?`0 0 14px ${t.color}50`:'none'}" onclick="event.stopPropagation();toggleDone('${workout.id}')">${done?'✓':''}</button></div>`;}).join('');
      return`<div class="week-body"><div class="km-bar-wrap"><div class="km-bar-fill" style="width:${barW}%;background:linear-gradient(90deg,${ap.color}60,${ap.color})"></div></div>${wHtml}</div>`;
    })():'';
    card.innerHTML=`<div class="week-header" onclick="toggleWeek(${week.week})"><div class="week-num" style="color:${allDone?ap.color:isOpen?ap.color+'70':'#202340'}">${String(week.week).padStart(2,'0')}</div><div class="week-info"><div class="week-badges">${badgesHtml}</div><div class="week-dots">${dotsHtml}</div></div><div class="week-km-wrap"><div class="week-km" style="color:${allDone?ap.color:'#252840'}">${weekKm}</div><div class="week-km-lbl">KM</div></div><div class="chevron" style="transform:${isOpen?'rotate(180deg)':'none'}">▼</div></div>${weekBodyHtml}`;
    c.appendChild(card);
  });
}

function toggleWeek(n){openWeek=openWeek===n?null:n;renderWeeks();}
function toggleDone(id){data[id]={...(data[id]||{}),done:!(data[id]?.done)};saveData();updateHeader();renderTabs();renderWeeks();if(currentModal===id)refreshModal();}

function openModal(id){
  const workout=allW.find(w=>w.id===id);if(!workout)return;
  currentModal=id;const t=TYPE[workout.type];const wd=data[id]||{};
  const sheet=document.getElementById('workout-sheet');
  sheet.style.borderTop=`3px solid ${t.color}`;sheet.style.boxShadow=`0 -14px 60px ${t.color}22`;
  document.getElementById('modal-icon').style.background=t.color+'20';document.getElementById('modal-icon').textContent=t.icon;
  document.getElementById('modal-name').style.color=t.color;document.getElementById('modal-name').textContent=t.name;
  document.getElementById('modal-meta').textContent=workout.day+' · ♥ '+t.bpm;
  document.getElementById('modal-km').style.color=t.color;document.getElementById('modal-km').textContent=workout.km;
  document.getElementById('modal-time').value=wd.time||'';document.getElementById('modal-time').style.border=`1.5px solid ${t.color}28`;
  document.getElementById('modal-notes').value=wd.notes||'';document.getElementById('modal-notes').style.border=`1.5px solid ${t.color}28`;
  refreshModal();document.getElementById('workout-modal').style.display='flex';
}
function refreshModal(){
  if(!currentModal)return;const workout=allW.find(w=>w.id===currentModal);const t=TYPE[workout.type];const wd=data[currentModal]||{};
  const btn=document.getElementById('modal-done-btn');
  btn.textContent=wd.done?'✓ Ukończony':'Oznacz jako zrobiony';btn.style.background=wd.done?'#0d0f1e':t.color;
  btn.style.border=`2px solid ${t.color}`;btn.style.color=wd.done?t.color:'#07080f';btn.style.boxShadow=!wd.done?`0 4px 20px ${t.color}40`:'none';
}
function toggleModalDone(){toggleDone(currentModal);}
function onModalInput(field,val){if(!currentModal)return;data[currentModal]={...(data[currentModal]||{}),[field]:val};saveData();renderWeeks();}
function closeModal(){document.getElementById('workout-modal').style.display='none';currentModal=null;}
function showRules(){
  document.getElementById('rules-list').innerHTML=RULES.map((r,i)=>`<div style="display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid #141628"><div style="width:26px;height:26px;border-radius:50%;background:#f65b5b18;border:1.5px solid #f65b5b40;display:flex;align-items:center;justify-content:center;font-size:12px;color:#f65b5b;font-weight:800;flex-shrink:0">${i+1}</div><span style="font-size:13px;color:#b0b8d8;line-height:1.5">${r}</span></div>`).join('');
  document.getElementById('rules-modal').style.display='flex';
}

loadData();updateHeader();renderTabs();renderWeeks();
</script>
</body>
</html>
